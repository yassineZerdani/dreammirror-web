<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DreamMirror">
  <!--
    Brand mark for DreamMirror.
    Pure SVG, brand tokens only:
      bg     night #0B0D12  -> deep #12151F
      moon   moon #E8E6E3   -> star #9DB4C8
      halo   glow #6B8AA8
      stars  star #9DB4C8
      ring   line #2A3142
    Renders cleanly from 16px (favicon) to 80px (download hero).
  -->
  <defs>
    <radialGradient id="dm-bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%"  stop-color="#1A1F2E"/>
      <stop offset="60%" stop-color="#12151F"/>
      <stop offset="100%" stop-color="#0B0D12"/>
    </radialGradient>
    <linearGradient id="dm-moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F4F2EE"/>
      <stop offset="55%"  stop-color="#E8E6E3"/>
      <stop offset="100%" stop-color="#9DB4C8"/>
    </linearGradient>
    <radialGradient id="dm-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#6B8AA8" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#6B8AA8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6B8AA8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dm-ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2A3142" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2A3142" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="63" height="63" rx="14" fill="url(#dm-bg)" stroke="url(#dm-ring)" stroke-width="1"/>

  <circle cx="32" cy="34" r="20" fill="url(#dm-halo)"/>

  <g>
    <circle cx="32" cy="32" r="13" fill="url(#dm-moon)"/>
    <circle cx="38" cy="28" r="11.2" fill="#0B0D12"/>
  </g>

  <g fill="#9DB4C8">
    <circle cx="14" cy="16" r="0.9" opacity="0.85"/>
    <circle cx="50" cy="14" r="0.7" opacity="0.7"/>
    <circle cx="20" cy="50" r="0.7" opacity="0.7"/>
    <circle cx="48" cy="48" r="0.9" opacity="0.85"/>
    <circle cx="11" cy="34" r="0.5" opacity="0.55"/>
    <circle cx="54" cy="34" r="0.5" opacity="0.55"/>
  </g>
</svg>
