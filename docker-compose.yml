# DreamMirror marketing site — production container.
# 1) cp .env.example .env  (set NEXT_PUBLIC_SITE_URL to your https domain)
# 2) docker compose up -d --build
# 3) Put Caddy / nginx / Traefik in front for HTTPS (container listens on 127.0.0.1:WEB_PORT).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://YOUR_MARKETING_HOST.example.com}
        NEXT_PUBLIC_APK_URL: ${NEXT_PUBLIC_APK_URL:-/download/dreammirror.apk}
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-1.0.0}
        NEXT_PUBLIC_APK_SIZE: ${NEXT_PUBLIC_APK_SIZE:-}
        NEXT_PUBLIC_IPA_URL: ${NEXT_PUBLIC_IPA_URL:-}
        NEXT_PUBLIC_IPA_VERSION: ${NEXT_PUBLIC_IPA_VERSION:-}
        NEXT_PUBLIC_IPA_SIZE: ${NEXT_PUBLIC_IPA_SIZE:-}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-support@dreammirror.app}
    environment:
      # Server-only: where the /download/dreammirror.apk proxy fetches from.
      APK_UPSTREAM_URL: ${APK_UPSTREAM_URL:-https://github.com/yassineZerdani/dreammirror-web/releases/latest/download/dreammirror.apk}
      NODE_ENV: production
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
